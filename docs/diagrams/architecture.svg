<text x="20" y="425" font-size="15" font-weight="700" text-anchor="start" fill="#1f2328">Data flow</text>
<circle cx="30" cy="446" r="8" fill="#0969da"/>
<text x="30" y="450" font-size="11" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
<text x="48" y="450" font-size="12.5" font-weight="400" text-anchor="start" fill="#1f2328">Download the zip from the archive page links through src/ksei/client.py (pool ksei_http, 1 slot) into bronze/raw; the file is never overwritten.</text>
<circle cx="30" cy="462" r="8" fill="#0969da"/>
<text x="30" y="466" font-size="11" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
<text x="48" y="466" font-size="12.5" font-weight="400" text-anchor="start" fill="#1f2328">Parse into Parquet (polars): every column a string, plus _period, _source_file, _ingested_at.</text>
<circle cx="30" cy="478" r="8" fill="#0969da"/>
<text x="30" y="482" font-size="11" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
<text x="48" y="482" font-size="12.5" font-weight="400" text-anchor="start" fill="#1f2328">load_bronze: drop the period partition, then INSERT ... SELECT from s3() with each column cast to its registry type.</text>
<circle cx="30" cy="494" r="8" fill="#0969da"/>
<text x="30" y="498" font-size="11" font-weight="700" text-anchor="middle" fill="#ffffff">4</text>
<text x="48" y="498" font-size="12.5" font-weight="400" text-anchor="start" fill="#1f2328">dbt silver: hubs, link and satellites, insert-only, keyed by MD5 hashes (flags meta_is_active and is_deleted).</text>
<circle cx="30" cy="510" r="8" fill="#0969da"/>
<text x="30" y="514" font-size="11" font-weight="700" text-anchor="middle" fill="#ffffff">5</text>
<text x="48" y="514" font-size="12.5" font-weight="400" text-anchor="start" fill="#1f2328">dbt gold: facts and marts rebuilt every run (dim_period, fact_security_monthly, fact_holding_monthly, mart_foreign_ownership_monthly).</text>
<circle cx="30" cy="526" r="8" fill="#0969da"/>
<text x="30" y="530" font-size="11" font-weight="700" text-anchor="middle" fill="#ffffff">6</text>
<text x="48" y="530" font-size="12.5" font-weight="400" text-anchor="start" fill="#1f2328">Superset reads only gold tables over clickhousedb://.</text>
