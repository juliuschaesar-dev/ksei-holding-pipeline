  body,\n.dashboard,\n.dashboard-content,\n.ant-layout,\n.ant-layout-content {\n \
  \ background-color: #eef1f6 !important;\n}\n\n.dashboard-component-chart-holder,\n\
  .dashboard-component-markdown .markdown {\n  background-color: #ffffff;\n  border-radius:\
  \ 20px;\n  border: 0;\n  box-shadow: none;\n}\n\n.dashboard-markdown,\n.dashboard-component-markdown\
  \ {\n  color: #0f1a2b;\n}\n\n.dashboard-markdown h1 {\n  margin: 0;\n  font-size:\
  \ 44px;\n  font-weight: 800;\n  line-height: 1.05;\n  letter-spacing: -0.02em;\n\
  }\n\n.dashboard-markdown p {\n  font-family: ui-monospace, Menlo, Consolas, monospace;\n\
  \  font-size: 11px;\n  letter-spacing: 0.12em;\n  color: #4a5568;\n}\n\n.dashboard-component-markdown:first-child\
  \ .markdown,\n.dashboard-component-markdown .markdown {\n  background-color: transparent;\n\
  }\n\n.header-title,\n.chart-header .header-title {\n  font-weight: 700;\n  color:\
  \ #0f1a2b;\n}\n\n/* The image export lays each card out at the height of its content,\
  \ not at the height the dashboard\n   gives it, so cards of one row came out uneven.\
  \ Every card of the small rows gets the same minimum\n   height (28 grid units =\
  \ 224px, as in the layout): none of them is taller than that by itself. */\n[class*=\"\
  dashboard-chart-id-\"] {\n  min-height: 224px;\n}\n\n/* the image export draws a\
  \ chart card 10px taller than its minimum height, a Markdown card exactly at it\
  \ */\n.dashboard-markdown:has(h1) .dashboard-component-chart-holder {\n  min-height:\
  \ 234px;\n}\n"
